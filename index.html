<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6b4f1d" />
  <title>Código de Dios</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon-192.png" alt="Código de Dios" />
      <div><h1>Código de Dios</h1><p>12 temas · 3,600 versículos temáticos</p></div>
    </div>
    <div class="actions">
      <button id="themeBtn" title="Modo oscuro">◐</button>
      <button id="printBtn" title="Imprimir">🖨️</button>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <input id="search" type="search" placeholder="Buscar tema o referencia…" />
      <nav id="chapterList"></nav>
      <section class="sidebox">
        <strong>Progreso</strong>
        <div class="progress"><span id="progressBar"></span></div>
        <small id="progressText">0 de 3600 estudiados</small>
      </section>
      <button id="favoritesBtn" class="wide">★ Ver favoritos</button>
      <button id="notesBtn" class="wide">📝 Mis notas</button>
      <button id="installBtn" class="wide hidden">⬇ Instalar aplicación</button>
    </aside>

    <section class="content">
      <section class="hero" id="hero">
        <span class="chapter-number" id="chapterNumber">Capítulo 1</span>
        <h2 id="chapterTitle">Cómo seguir a Dios</h2>
        <p id="chapterIntro"></p>
        <div class="stats"><span id="verseCount">300 versículos</span><span id="readCount">0 estudiados</span></div>
      </section>

      <section class="toolbar">
        <select id="pageSize">
          <option value="10">10 por página</option>
          <option value="25">25 por página</option>
          <option value="50">50 por página</option>
        </select>
        <button id="prevBtn">← Anterior</button>
        <span id="pageInfo">Página 1</span>
        <button id="nextBtn">Siguiente →</button>
      </section>

      <div id="verseCards" class="cards"></div>
    </section>
  </main>

  <dialog id="notesDialog">
    <form method="dialog" class="dialog-card">
      <h3>Mis notas</h3>
      <textarea id="globalNotes" rows="12" placeholder="Escribe aquí tus reflexiones generales…"></textarea>
      <div class="dialog-actions"><button value="cancel">Cerrar</button><button id="saveNotes" value="default">Guardar</button></div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
